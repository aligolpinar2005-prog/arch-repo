name: Chrome Test ve Derleme

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-with-chrome:
    runs-on: self-hosted

    steps:
      - name: Depoyu Kopyala (Checkout)
        uses: actions/checkout@v4

      - name: Google Chrome Stable Kurulumu
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Chrome Sürümünü Doğrula
        run: |
          google-chrome-stable --version
          echo "Google Chrome başarıyla kuruldu ve çalıştırılmaya hazır."
