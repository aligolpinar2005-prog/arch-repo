name: Arch Linux Local Repo Builder

on:
  push:
    branches:
      - main

jobs:
  build-packages:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Builder User
        run: |
          id -u builder &>/dev/null || useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder ${{ github.workspace }}

      - name: Build Google Chrome Package
        run: |
          set -e  # Hata alırsan betiği hemen durdur ve hatayı göster
          mkdir -p x86_64

          echo "Building google-chrome as unprivileged user..."
          rm -rf /tmp/google-chrome

          git clone https://aur.archlinux.org/google-chrome.git /tmp/google-chrome
          chown -R builder:builder /tmp/google-chrome

          # Bağımlılıkları kurarak ve çıktıyı ekrana vererek derle
          sudo -u builder bash -c "cd /tmp/google-chrome && makepkg -si --noconfirm --skippgpcheck"

          echo "Derlenen paketler:"
          ls -la /tmp/google-chrome/

          cp /tmp/google-chrome/*.pkg.tar.zst x86_64/

      - name: Update Repository Database
        run: |
          cd x86_64
          ls -la
          repo-add arch-repo.db.tar.gz *.pkg.tar.zst
          cd ..

      - name: Commit and Push Built Packages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add x86_64/
          git diff --staged --quiet || git commit -m "chore: update local arch repository packages [skip ci]"
          git push
