name: Arch Linux Local Repo Builder

on:
  push:
    branches:
      - main

jobs:
  build-packages:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Google Chrome Package
        run: |
          mkdir -p x86_64

          # Google Chrome paketini klonla ve yerelde derle
          echo "Building google-chrome..."
          rm -rf /tmp/google-chrome
          git clone https://aur.archlinux.org/google-chrome.git /tmp/google-chrome
          cd /tmp/google-chrome

          # Self-hosted runner root veya normal kullanıcı ile çalışabileceği için makepkg -s komutu
          makepkg -s --noconfirm --skippgpcheck

          # Derlenen paketi x86_64 deposuna kopyala
          cp *.pkg.tar.zst ~/arch-repo/x86_64/
          cd ~/arch-repo

      - name: Update Repository Database
        run: |
          cd x86_64
          rm -f arch-repo.db* arch-repo.files*
          repo-add arch-repo.db.tar.gz *.pkg.tar.zst
          cd ..

      - name: Commit and Push Built Packages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add x86_64/
          git diff --staged --quiet || git commit -m "chore: update local arch repository packages [skip ci]"
          git push
