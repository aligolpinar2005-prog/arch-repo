name: Arch Linux Repo Builder

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'

jobs:
  build-packages:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Arch Linux Configuration
        run: pacman -Syu --noconfirm --needed base-devel git sudo

      - name: Create Unprivileged User
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder ./
      - name: Build Packages
        run: |
          mkdir -p x86_64
          
          # 1. Paket: yay-bin
          echo "Building yay-bin..."
          rm -rf /tmp/yay-bin
          sudo -u builder bash -c "cd /tmp && git clone https://aur.archlinux.org/yay-bin.git && cd yay-bin && makepkg -s --noconfirm --skippgpcheck"
          cp /tmp/yay-bin/*.pkg.tar.zst x86_64/
          
          # 2. Paket: google-chrome
          echo "Building google-chrome..."
          rm -rf /tmp/google-chrome
          sudo -u builder bash -c "cd /tmp && git clone https://aur.archlinux.org/google-chrome.git && cd google-chrome && makepkg -s --noconfirm --skippgpcheck"
          cp /tmp/google-chrome/*.pkg.tar.zst x86_64/

      - name: Update Repository Database
        run: |
          cd x86_64
          rm -f arch-repo.db arch-repo.files
          repo-add arch-repo.db.tar.gz *.pkg.tar.zst

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
