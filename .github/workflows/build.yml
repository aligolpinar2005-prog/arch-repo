name: Arch Linux Local Repo Builder

on:
  push:
    branches:
      - main

jobs:
  build-packages:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build Google Chrome Package
        run: |
          set -e
          mkdir -p x86_64

          echo "Building google-chrome..."
          rm -rf /tmp/google-chrome

          git clone https://aur.archlinux.org/google-chrome.git /tmp/google-chrome

          cd /tmp/google-chrome
          makepkg -s --noconfirm --skippgpcheck

          cp /tmp/google-chrome/*.pkg.tar.zst ${{ github.workspace }}/x86_64/

      - name: Update Repository Database
        run: |
          cd x86_64
          ls -la
          repo-add arch-repo.db.tar.gz *.pkg.tar.zst
          cd ..

      - name: Commit and Push with Git LFS
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Git LFS ile .pkg.tar.zst uzantılı büyük dosyaları takip et
          git lfs track "*.pkg.tar.zst"
          git add .gitattributes

          # Dosyaları zorla ekle ve LFS ile gönder
          git add -f x86_64/
          git diff --staged --quiet || git commit -m "chore: update local arch repository packages with LFS [skip ci]"
          git push
