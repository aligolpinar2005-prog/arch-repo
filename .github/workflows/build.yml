name: Arch Linux Repo Builder

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'

jobs:
  build-packages:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Arch Linux Configuration
        run: pacman -Syu --noconfirm --needed base-devel git sudo

      - name: Create Unprivileged User
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder ./

     - name: Build Google Chrome and Yay
       run: |
         for pkg in yay-bin google-chrome; do
         rm -rf /tmp/$pkg
         sudo -u builder bash -c "cd /tmp && git clone https://aur.archlinux.org/$pkg.git && cd $pkg && makepkg -s --noconfirm --skippgpcheck"
         cp /tmp/$pkg/*.pkg.tar.zst x86_64/
        done

      - name: Update Repository Database
        run: |
          cd x86_64
          rm -f arch-repo.db arch-repo.files
          repo-add arch-repo.db.tar.gz *.pkg.tar.zst

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
