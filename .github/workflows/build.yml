name: Arch Linux Repo Builder

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'

jobs:
  build-packages:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Arch Linux Configuration
        run: |
          pacman -Syu --noconfirm --needed base-devel git sudo

      - name: Create Unprivileged User (Required for makepkg)
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder ./

      - name: Build Packages (Example: yay-bin)
        shell: su builder {0}
        run: |
          git clone https://aur.archlinux.org/yay-bin.git /tmp/yay-bin
          cd /tmp/yay-bin
          makepkg -s --noconfirm
          cp *.pkg.tar.zst $GITHUB_WORKSPACE/x86_64/

      - name: Update Repository Database
        run: |
          cd x86_64
          repo-add arch-repo.db.tar.gz *.pkg.tar.zst
          cp arch-repo.db.tar.gz arch-repo.db
          cp arch-repo.files.tar.gz arch-repo.files

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages